# herdr status (OSC 7501) for agents in OMS panel mains: see herdr-tmux-osc --help
set-hook -g 'session-created[77]' 'run-shell -b "$HOME/.local/bin/herdr-tmux-osc scan"'
set-hook -g 'after-new-window[77]' 'run-shell -b "$HOME/.local/bin/herdr-tmux-osc scan"'
set-hook -g 'after-split-window[77]' 'run-shell -b "$HOME/.local/bin/herdr-tmux-osc scan"'
