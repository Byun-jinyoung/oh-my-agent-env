# Managed GJC settings applied by `setup.sh sync` via `gjc config set <key> <value>`.
# Format: <dotted.key><whitespace><value>. Lines starting with # are ignored.
#
# ROOT CAUSE of abnormal usage (measured 2026-09-16, docs/runtime-context-control.md):
# Model context windows are enormous — claude-opus-4-8 / claude-sonnet-5 = 1,000,000;
# gpt-5.6-terra / gpt-5.6-sol = 372,000 (from ~/.gjc/agent/models.db). Compaction's
# thresholdPercent is a PERCENT OF THAT WINDOW, so thresholdPercent=80 only fires at
# 800,000 (Claude) / 297,600 (Codex). Context therefore balloons to hundreds of K and
# EVERY user turn re-processes the whole thing (as cacheRead, or full input on a cache
# miss). Measured on one real session (01a0a26e): 114 turns, 46.5M total tokens for
# 136K output = 341x amplification, ~408K tokens/turn, context grown to ~385K.
# This is provider-independent: it happens on Claude AND Codex. Model choice is NOT
# the cause.
#
# FIX: cap context by an ABSOLUTE token budget. thresholdTokens "overrides percentage
# if set" (settings-schema.ts), so it fires at a fixed size regardless of a 372K or 1M
# window. Measured: thresholdTokens=40000 triggered compaction on the 372K Codex model
# (where 80% would have waited until 297,600). 100000 caps per-turn reprocess at ~100K
# instead of letting it climb toward 800K.
#
# (Earlier revisions of this file recommended thresholdPercent=80 and thresholdTokens=-1
#  "for provider independence" — that was wrong; on a 1M window it is the bug itself.)
compaction.enabled	true
compaction.strategy	handoff
compaction.thresholdTokens	150000
compaction.keepRecentTokens	40000
compaction.autoContinue	true
compaction.handoffSaveToDisk	true

# Idle compaction: shrink an idle session above this size before it is resumed cold.
# Default idleThresholdTokens is 200000 (too high given the real growth curve).
compaction.idleEnabled	true
compaction.idleThresholdTokens	100000

# Auto-promoting to a larger-context model on overflow raises usage; keep off.
contextPromotion.enabled	false

# --- handoff fidelity (measured 2026-09-16) -----------------------------------
# Generated handoff reproduced R1-R3, decision D1 and rejected approach A1 verbatim
# under a "Standing constraints" heading. Quoted; sync strips one layer of quotes.
# The goal-arming clause is load-bearing for auto-continue: GJC's #ru() only keeps
# firing while a goal is ACTIVE or todos are open (a paused/completed/absent goal
# stops the chain), so every handoff child must re-arm an active goal before work.
compaction.handoffPromptExtension	"Preserve verbatim, in a section titled "Standing constraints": every user instruction still in force (scope limits, forbidden actions, approval state), every decision already made and its reason, and every rejected approach. Never summarize these away, never soften them, and never mark them resolved unless the user explicitly released them. Also record: files changed, verification already run with its result, and the exact next step. Then, before anything else, if the objective still has remaining work, call goal(create) or goal(resume) so an ACTIVE goal is live, and keep it active for the whole objective — never pause or complete it while work remains, because auto-continue only fires while a goal is active or todos are open and a paused, completed, or absent goal stops the handoff chain. After arming the goal, immediately continue the exact next step without waiting for the user."

# --- cross-session tracking ---------------------------------------------------
# Local rollout summarisation writes memory_summary.md and injects a bounded summary
# into later sessions, so a NEW session recovers context without resuming the old
# transcript. Local-only (no remote service).
memory.backend	local
memories.enabled	true
