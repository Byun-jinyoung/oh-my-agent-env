name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint is a separate job from tests on purpose: scripts/check.sh reports the
  # first failing stage and exits, so a single shellcheck nit in a combined job
  # would hide every test result. A second runner buys an independent red/green.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not apt. scripts/check.sh promises that local green and CI green
      # mean the same thing, and an unpinned linter breaks exactly that promise:
      # a runner image bump can fail the build on code nobody touched, and the
      # failure does not reproduce locally. Bump this deliberately, after running
      # the same version yourself.
      - name: Install shellcheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          echo "$PWD/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: Lint
        env:
          OMA_REQUIRE_SHELLCHECK: "1"
        run: bash scripts/check.sh --lint-only

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # The smoke suite sandboxes HOME/XDG/TMPDIR itself; it must never depend
      # on the runner's home being pristine, because a developer running it
      # locally does not have that luxury either.
      - name: Tests
        run: bash scripts/check.sh --no-lint
